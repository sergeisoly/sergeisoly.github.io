project:
  type: website
  output-dir: _site
  pre-render: sh scripts/build-observatory.sh
  post-render:
    - python3 scripts/prune-empty-drafts.py
    - python3 scripts/add-observatory-analytics.py
  resources:
    - robots.txt
    - /posts/ai-research-atlas/index.html
    - /piramid-observatory/**
  render:
    - index.qmd
    - research.qmd
    - projects.qmd
    - "projects/**/index.qmd"
    - posts.qmd
    - about.qmd
    - "posts/**/index.qmd"

website:
  title: Sergei Solovev
  favicon: favicon.svg
  image: social-card.png
  open-graph: true
  twitter-card: true
  site-url: https://sergeisoly.github.io/
  description: "Research, interactive projects, and writing by Sergei Solovev."
  navbar:
    collapse-below: sm
    left:
      - href: research.qmd
        text: Research
      - href: projects.qmd
        text: Projects
      - href: posts.qmd
        text: Posts
      - href: about.qmd
        text: About
  page-footer:
    right:
      - text: RSS
        href: posts.xml

format:
  html:
    include-in-header: _includes/goatcounter.html
    theme: cosmo
    html-math-method: plain
    css: styles.css
    toc: false

execute:
  eval: false
