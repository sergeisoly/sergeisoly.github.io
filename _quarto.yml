project:
  type: website
  output-dir: _site
  post-render: python3 scripts/prune-empty-drafts.py
  resources:
    - robots.txt
  render:
    - index.qmd
    - research.qmd
    - posts.qmd
    - about.qmd
    - "posts/**/index.qmd"

website:
  title: Sergei Solovev
  favicon: favicon.svg
  image: social-card.png
  open-graph: true
  twitter-card: true
  site-url: https://sergeisoly.github.io/
  description: "Research and writing by Sergei Solovev."
  navbar:
    collapse-below: sm
    left:
      - href: research.qmd
        text: Research
      - href: posts.qmd
        text: Posts
      - href: about.qmd
        text: About
  page-footer:
    right:
      - text: RSS
        href: posts.xml

format:
  html:
    include-in-header:
      text: |
        <script data-goatcounter="https://sergeisoly.goatcounter.com/count"
                async src="https://gc.zgo.at/count.js" data-external="1"></script>
    theme: cosmo
    html-math-method: plain
    css: styles.css
    toc: false

execute:
  eval: false
