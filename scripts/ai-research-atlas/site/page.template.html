<!-- Generated by build_data.py from post/index.qmd. Standalone preview that mirrors sergeisoly.github.io. -->
<style>
  :root { --paper: #faf9f5; --ink: #182d3b; --muted: #526771; --rule: #dce2df; --accent: #2364a5; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 1rem/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-underline-offset: .2em; }
  a:hover { color: #143e68; }
  .navbar { border-bottom: 1px solid var(--rule); padding: .95rem max(16px, env(safe-area-inset-right, 0px)) .95rem max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 1.4rem; align-items: baseline; }
  .navbar .brand { font: 500 1.35rem Georgia, serif; letter-spacing: -.025em; color: var(--ink); text-decoration: none; margin-right: .4rem; }
  .navbar a.nav { color: var(--ink); text-decoration: none; font-size: .95rem; }
  .page { max-width: 1240px; margin: 0 auto; padding-block: 0 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .body { max-width: 46rem; margin: 0 auto; }
  .body > .column-page, .body > .column-screen-inset { --w: min(1180px, calc(100vw - 32px)); width: var(--w); margin-left: calc((100% - var(--w)) / 2); }
  header.title-block { margin: 2.6rem 0 1.6rem; }
  h1 { font: 500 clamp(1.9rem, 3vw, 2.7rem)/1.15 Georgia, "Times New Roman", serif; letter-spacing: -.025em; margin: 0 0 .9rem; text-wrap: balance; }
  .description { color: var(--muted); font-size: 1.12rem; max-width: 46rem; margin: 0 0 1.2rem; }
  .meta { display: flex; gap: 2.5rem; font-size: .85rem; border-top: 1px solid var(--rule); padding-top: .8rem; }
  .meta div span { display: block; font: 600 .72rem/1.5 -apple-system, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .body > h2 { font: 500 1.7rem/1.2 Georgia, "Times New Roman", serif; letter-spacing: -.025em; margin: 3rem 0 .8rem; text-wrap: balance; }
  .body > p { margin: 0 0 1rem; }
  footer { border-top: 1px solid var(--rule); padding: 1rem max(16px, env(safe-area-inset-right, 0px)) 2rem; text-align: right; font-size: .85rem; color: var(--muted); }
</style>
</head>

{{body}}
